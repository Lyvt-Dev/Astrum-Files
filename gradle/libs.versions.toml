[versions]
agp = "8.11.1"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
hilt = "2.57"
composeBom = "2025.07.00"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.2"
navigation = "2.9.2"
